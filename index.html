<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe2">
<title>あしあとマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--ink:#2b2118;--card:#fffaf1;--line:#e6dac4;--acc:#8a5a2b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Zen Maru Gothic",system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#e9e3d6}
.leaflet-control-attribution{font-size:10px}
.top{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
.brand,.stats{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:0 4px 14px rgba(60,40,20,.12)}
.brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px}
.brand canvas{width:22px;height:22px}
.stats{margin-left:auto;display:flex;gap:14px;font-size:13px;white-space:nowrap}
.stats b{font-size:17px;font-variant-numeric:tabular-nums}
.town{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 64px);left:10px;max-width:calc(100% - 20px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;box-shadow:0 4px 14px rgba(60,40,20,.12);display:none;align-items:center;gap:8px}
.town.show{display:flex}
.town .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.town .bar{width:64px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:none}
.town .bar i{display:block;height:100%;background:var(--acc);width:0}
.town b{font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;z-index:950;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:18px 22px;text-align:center;font-weight:900;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;max-width:86vw}
.toast.show{display:block}
.toast small{display:block;font-weight:500;font-size:13px;margin-top:4px}
.side{position:fixed;z-index:500;right:10px;bottom:calc(env(safe-area-inset-bottom) + 214px);display:flex;flex-direction:column;gap:8px}
.side button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:11px;font-weight:700;color:var(--ink);box-shadow:0 4px 14px rgba(60,40,20,.12)}
.side button.on{background:var(--ink);color:#fff}
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(60,40,20,.15);padding:12px 14px calc(env(safe-area-inset-bottom) + 14px)}
.label{font-size:13px;font-weight:700;opacity:.7;margin:0 4px 6px}
.animals{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.animals::-webkit-scrollbar{display:none}
.an{flex:none;scroll-snap-align:start;width:72px;padding:6px 0 4px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.an canvas{width:38px;height:38px}
.an[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,#fff)}
.row{display:flex;gap:8px;margin-top:6px}
.go{flex:1;height:56px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:19px;font-weight:900;letter-spacing:.04em;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 40%,transparent)}
.go.rec{background:#fff;color:var(--acc);border:3px solid var(--acc)}
.go.rec::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#e33;margin-right:8px;vertical-align:2px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.go.rec::before{animation:none}}
.sub{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--ink)}
.msg{font-size:12px;opacity:.75;margin:8px 4px 0;min-height:18px}
.modal{position:fixed;inset:0;z-index:900;background:rgba(30,20,10,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font-size:19px}
.box p{margin:0 0 16px;font-size:14px}
.box .row button{flex:1;height:48px;border-radius:14px;font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink)}
.box .row .danger{background:#c63b2b;color:#fff;border:0}
.me{width:18px;height:18px;border-radius:50%;background:#2d7ff9;border:3px solid #fff;box-shadow:0 0 0 2px rgba(45,127,249,.35),0 2px 6px rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid #2d7ff9;outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand"><canvas id="logo" width="44" height="44"></canvas>あしあと</div>
  <div class="stats">
    <span><b id="dist">0.00</b> km</span>
    <span><b id="count">0</b> 歩</span>
    <span><b id="flags">0</b> 旗</span>
  </div>
</div>
<div class="town" id="town"><span class="nm" id="tname"></span><span class="bar"><i id="tbar"></i></span><b id="tpct"></b></div>
<div class="toast" id="toast"></div>

<div class="side">
  <button id="follow" class="on" aria-label="現在地を追う">追従</button>
  <button id="fit" aria-label="全部の足跡を表示">全体</button>
  <button id="demo" aria-label="デモ歩行">デモ</button>
</div>

<div class="sheet">
  <div class="label">どの動物で歩く？</div>
  <div class="animals" id="animals"></div>
  <div class="row">
    <button class="go rec" id="go">記録中（タップで停止）</button>
    <button class="sub" id="clear">消す</button>
  </div>
  <div class="msg" id="msg">位置情報を許可すると、歩いた道に足跡がつきます</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box">
    <h2 id="mt">足跡をぜんぶ消す？</h2>
    <p>これまで歩いた足跡と立てた旗がすべて消えます。元に戻せません。</p>
    <div class="row"><button id="no">やめる</button><button id="yes" class="danger">消す</button></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
{
/* ---------- 動物の足跡の形（単位座標：前方が -y、だいたい -1〜1） ---------- */
const E = (x,y,rx,ry,r=0)=>{const p=new Path2D();p.ellipse(x,y,rx,ry,r,0,Math.PI*2);return p};
const join = list=>{const p=new Path2D();list.forEach(q=>p.addPath(q));return p};
const toes = (pts,rx,ry)=>pts.map(([x,y,r])=>E(x,y,rx,ry,r||0));

const ANIMALS = [
  {id:'dog',name:'イヌ',color:'#8a5a2b',stride:4,
    fill:join([E(0,.38,.42,.34),...toes([[-.52,-.12,-.35],[-.19,-.48,-.1],[.19,-.48,.1],[.52,-.12,.35]],.16,.22),
      ...toes([[-.62,-.38,-.4],[-.24,-.78,-.1],[.24,-.78,.1],[.62,-.38,.4]],.05,.09)])},
  {id:'cat',name:'ネコ',color:'#e0508a',stride:3.2,
    fill:join([E(0,.42,.36,.26),E(-.26,.3,.2,.22),E(.26,.3,.2,.22),
      ...toes([[-.5,-.1],[-.18,-.42],[.2,-.44],[.52,-.12]],.15,.17)])},
  {id:'bear',name:'クマ',color:'#3d2a1f',stride:5,
    fill:join([E(0,.32,.6,.44),E(0,.66,.4,.2),...toes([[-.66,-.18,-.5],[-.34,-.44,-.25],[0,-.54],[.34,-.44,.25],[.66,-.18,.5]],.13,.16),
      ...toes([[-.8,-.42,-.55],[-.42,-.74,-.25],[0,-.86],[.42,-.74,.25],[.8,-.42,.55]],.045,.11)])},
  {id:'bird',name:'トリ',color:'#e08a00',stride:2.4,
    stroke:(()=>{const p=new Path2D();p.moveTo(0,.3);p.lineTo(0,-.85);p.moveTo(0,.3);p.lineTo(-.6,-.5);p.moveTo(0,.3);p.lineTo(.6,-.5);p.moveTo(0,.3);p.lineTo(0,.85);return p})()},
  {id:'rabbit',name:'ウサギ',color:'#7a62e8',stride:4.5,
    fill:join([E(0,.12,.27,.72),...toes([[-.2,-.72],[-.07,-.84],[.07,-.84],[.2,-.72]],.07,.1)])},
  {id:'elephant',name:'ゾウ',color:'#5f7488',stride:6,
    fill:join([E(0,.05,.78,.82),...toes([[-.52,-.72,-.5],[-.18,-.86,-.15],[.18,-.86,.15],[.52,-.72,.5]],.15,.11)])},
  {id:'duck',name:'アヒル',color:'#f2b600',stride:2.6,
    fill:(()=>{const p=new Path2D();p.moveTo(0,.75);p.quadraticCurveTo(-.15,.1,-.68,-.55);p.quadraticCurveTo(-.34,-.4,-.3,-.62);p.quadraticCurveTo(-.15,-.3,0,-.85);p.quadraticCurveTo(.15,-.3,.3,-.62);p.quadraticCurveTo(.34,-.4,.68,-.55);p.quadraticCurveTo(.15,.1,0,.75);p.closePath();return p})()},
];

function drawPrint(ctx,a,x,y,size,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(size/2,size/2);
  ctx.lineJoin='round';ctx.lineCap='round';
  if(a.stroke){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.34;ctx.stroke(a.stroke);
    ctx.strokeStyle=a.color;ctx.lineWidth=.17;ctx.stroke(a.stroke);
  }else{
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.14;ctx.stroke(a.fill);
    ctx.fillStyle=a.color;ctx.fill(a.fill);
  }
  ctx.restore();
}

/* ---------- 保存 ---------- */
const KEY='ashiato-v1';
let store={prints:[],dist:0,animal:0,towns:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.prints))store=Object.assign(store,s)}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// 同じ場所（約4m四方）には足跡を1つだけ：同じ道を何度歩いても重ならない
const CELL=4,cellKey=(la,ln)=>Math.floor(la*111320/CELL)+','+Math.floor(ln*111320*Math.cos(la*Math.PI/180)/CELL);
const used=new Set(store.prints.map(p=>cellKey(p[0],p[1])));
let saveT=0;
const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){msg('保存できませんでした（容量不足かも）')}},800)};

/* ---------- 地図 ---------- */
const start = store.prints.length ? [store.prints.at(-1)[0],store.prints.at(-1)[1]] : [35.6812,139.7671];
const map=L.map('map',{zoomControl:false,zoomAnimation:false,attributionControl:true}).setView(start,17);
// 文字なし地図（OpenFreeMap のベクター地図から文字・記号レイヤーを外す）＋ 地形の陰影
try{
const base=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',
  attribution:'<a href="https://openfreemap.org">OpenFreeMap</a> &copy; OpenStreetMap contributors'}).addTo(map);
{const gl=base.getMaplibreMap();const strip=()=>{for(const l of gl.getStyle().layers)if(l.type==='symbol'||l.type==='fill-extrusion')gl.removeLayer(l.id)};
 gl.on('style.load',strip);if(gl.isStyleLoaded())strip();}
}catch(e){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png',{maxNativeZoom:16,maxZoom:20,opacity:.22,
  attribution:'地理院タイル'}).addTo(map);

const PrintLayer=L.Layer.extend({
  onAdd(m){this.c=L.DomUtil.create('canvas','');this.c.style.pointerEvents='none';
    m.getPanes().overlayPane.appendChild(this.c);m.on('moveend zoomend resize viewreset move',this.draw,this);this.draw()},
  onRemove(m){this.c.remove();m.off('moveend zoomend resize viewreset move',this.draw,this)},
  draw(){
    const m=this._map,c=this.c,sz=m.getSize(),dpr=devicePixelRatio||1;
    L.DomUtil.setPosition(c,m.containerPointToLayerPoint([0,0]));
    c.width=sz.x*dpr;c.height=sz.y*dpr;c.style.width=sz.x+'px';c.style.height=sz.y+'px';
    const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    const lat=m.getCenter().lat,mpp=40075016.686*Math.cos(lat*Math.PI/180)/2**(m.getZoom()+8);
    const z=m.getZoom(),taken=new Set();
    if(z<16){                                   // 引いたとき：歩いた場所を塗りつぶし
      const r=Math.max(2.5,5/mpp),g=r*1.2;
      ctx.globalAlpha=.6;
      for(const p of store.prints){
        const pt=m.latLngToContainerPoint([p[0],p[1]]);
        if(pt.x<-10||pt.y<-10||pt.x>sz.x+10||pt.y>sz.y+10)continue;
        const k=Math.round(pt.x/g)+','+Math.round(pt.y/g);if(taken.has(k))continue;taken.add(k);
        ctx.fillStyle=(ANIMALS[p[3]]||ANIMALS[0]).color;ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,7);ctx.fill();
      }
      ctx.globalAlpha=1;drawFlags(ctx,m,sz);return;
    }
    for(let i=store.prints.length-1;i>=0;i--){   // 寄ったとき：足跡（新しいものを優先、重なりは間引く）
      const p=store.prints[i],a=ANIMALS[p[3]]||ANIMALS[0];
      const size=Math.max(20,a.stride*.9/mpp);
      const pt=m.latLngToContainerPoint([p[0],p[1]]);
      if(pt.x<-40||pt.y<-40||pt.x>sz.x+40||pt.y>sz.y+40)continue;
      const r=p[2]*Math.PI/180,off=p[4]*size*.42;
      const x=pt.x+Math.cos(r)*off,y=pt.y+Math.sin(r)*off,g=size*.95;
      const k=Math.round(x/g)+','+Math.round(y/g);if(taken.has(k))continue;taken.add(k);
      drawPrint(ctx,a,x,y,size,r);
    }
    drawFlags(ctx,m,sz);
  }
});
const prints=new PrintLayer().addTo(map);

/* ---------- 旗 ---------- */
function drawFlags(ctx,m,sz){
  for(const id in store.towns){
    const t=store.towns[id];if(t.flag==null||!t.c)continue;
    const pt=m.latLngToContainerPoint(t.c);
    if(pt.x<-60||pt.y<-60||pt.x>sz.x+60||pt.y>sz.y+60)continue;
    const a=ANIMALS[t.flag]||ANIMALS[0],x=pt.x,y=pt.y;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y,9,3.5,0,0,7);ctx.fill();
    ctx.strokeStyle='#4a3a2c';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-46);ctx.stroke();
    ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.arc(x,y-47,3.5,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+1,y-44);ctx.quadraticCurveTo(x+20,y-50,x+38,y-40);ctx.quadraticCurveTo(x+24,y-32,x+38,y-22);ctx.quadraticCurveTo(x+20,y-30,x+1,y-24);ctx.closePath();
    ctx.fillStyle=a.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
    drawPrint(ctx,{...a,color:'#fff'},x+17,y-34,14,0);
  }
}

/* ---------- 町（丁目）の道の占有率 ---------- */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const ROADS='^(primary|secondary|tertiary|unclassified|residential|living_street|pedestrian)(_link)?$';
const NEAR=10;                       // 道からこの距離(m)以内に足跡があれば「踏んだ」
async function overpass(q){             // 複数サーバーに同時に聞いて、一番早い正しい返事を使う
  const ctl=new AbortController();
  const one=u=>fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal}).then(async r=>{
    if(!r.ok)throw new Error(r.status);const j=await r.json();if(!j||!Array.isArray(j.elements))throw new Error('bad');return j});
  try{const j=await Promise.any(OVERPASS.map(one));ctl.abort();return j}catch(e){throw e}
}
const geoKey=id=>'ashiato-geo-'+id;
const geoMem={};
function loadGeo(id){if(geoMem[id])return geoMem[id];try{const g=JSON.parse(localStorage.getItem(geoKey(id)));if(g)return geoMem[id]=g}catch(e){}return null}
function inRings(rings,la,ln){let ins=false;for(const r of rings)for(let i=0,j=r.length-1;i<r.length;j=i++){const [ya,xa]=r[i],[yb,xb]=r[j];if((ya>la)!==(yb>la)&&ln<(xb-xa)*(la-ya)/(yb-ya)+xa)ins=!ins}return ins}
function buildRings(rel){
  const segs=rel.members.filter(m=>m.type==='way'&&m.role!=='inner'&&m.geometry).map(m=>m.geometry.map(g=>[g.lat,g.lon]));
  const inner=rel.members.filter(m=>m.type==='way'&&m.role==='inner'&&m.geometry).map(m=>m.geometry.map(g=>[g.lat,g.lon]));
  const same=(a,b)=>Math.abs(a[0]-b[0])<1e-7&&Math.abs(a[1]-b[1])<1e-7;
  const join=list=>{const out=[];list=list.slice();while(list.length){let r=list.shift().slice(),grew=true;
    while(!same(r[0],r.at(-1))&&grew){grew=false;for(let i=0;i<list.length;i++){const w=list[i];
      if(same(r.at(-1),w[0])){r=r.concat(w.slice(1))}else if(same(r.at(-1),w.at(-1))){r=r.concat(w.slice(0,-1).reverse())}else continue;
      list.splice(i,1);grew=true;break}}
    out.push(r.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]))}return out};
  return join(segs).concat(join(inner));
}
function centroid(rings,samples){
  let A=0,cx=0,cy=0;const r=rings.reduce((a,b)=>a.length>b.length?a:b,[]);
  for(let i=0,j=r.length-1;i<r.length;j=i++){const f=r[j][1]*r[i][0]-r[i][1]*r[j][0];A+=f;cx+=(r[j][1]+r[i][1])*f;cy+=(r[j][0]+r[i][0])*f}
  let c=A?[cy/(3*A),cx/(3*A)]:null;
  if(!c||!inRings(rings,c[0],c[1])){                 // 中心が町の外なら、一番近い道の点に
    const t=c||samples[0];let best=samples[0],bd=1e18;
    for(const s of samples){const d=(s[0]-t[0])**2+(s[1]-t[1])**2;if(d<bd){bd=d;best=s}}c=best}
  return c;
}
async function fetchTown(lat,lng){
  const a=await overpass(`[out:json][timeout:25];is_in(${lat},${lng})->.a;rel(pivot.a)["boundary"="administrative"]["admin_level"~"^(9|10)$"];out tags;`);
  const rels=(a.elements||[]).sort((x,y)=>(+y.tags.admin_level)-(+x.tags.admin_level));
  if(!rels.length)return null;
  const rel=rels[0],id=rel.id;
  if(loadGeo(id))return id;
  const rg=await overpass(`[out:json][timeout:60];rel(${id});out geom;`);
  const R1=rg.elements.find(e=>e.type==='relation');if(!R1||!R1.bounds)return null;
  const b=R1.bounds,g=await overpass(`[out:json][timeout:60];way["highway"~"${ROADS}"]["access"!~"^(private|no)$"]["area"!="yes"](${b.minlat},${b.minlon},${b.maxlat},${b.maxlon});out geom;`);
  g.elements.push(R1);
  const R0=g.elements.find(e=>e.type==='relation');if(!R0)return null;
  const rings=buildRings(R0);
  const samples=[],seen=new Set();
  for(const w of g.elements.filter(e=>e.type==='way'&&e.geometry)){
    for(let i=1;i<w.geometry.length;i++){
      const A=[w.geometry[i-1].lat,w.geometry[i-1].lon],B=[w.geometry[i].lat,w.geometry[i].lon],d=hav(A,B),n=Math.max(1,Math.ceil(d/5));
      for(let k=0;k<=n;k++){const la=A[0]+(B[0]-A[0])*k/n,ln=A[1]+(B[1]-A[1])*k/n;
        if(!inRings(rings,la,ln))continue;const key=cellKey(la,ln);if(seen.has(key))continue;seen.add(key);
        samples.push([+la.toFixed(6),+ln.toFixed(6)])}
    }
  }
  if(!samples.length)return null;
  const geo={id,name:(rel.tags.name||'名前のない町'),rings,samples,c:centroid(rings,samples)};
  geoMem[id]=geo;try{localStorage.setItem(geoKey(id),JSON.stringify(geo))}catch(e){}
  if(!store.towns[id])store.towns[id]={name:geo.name,c:geo.c,pct:0,flag:null};
  save();return id;
}
// 足跡の近傍検索用（約10mのマス）
const NC=NEAR,nKey=(la,ln)=>[Math.floor(la*111320/NC),Math.floor(ln*111320*Math.cos(la*Math.PI/180)/NC)];
const near=new Map();
const addNear=(p,i)=>{const [a,b]=nKey(p[0],p[1]),k=a+','+b;(near.get(k)||near.set(k,[]).get(k)).push(i)};
store.prints.forEach(addNear);
function coverage(geo){
  let hit=0;const votes=new Array(ANIMALS.length).fill(0);
  for(const s of geo.samples){
    const [a,b]=nKey(s[0],s[1]);let found=-1;
    for(let da=-1;da<=1&&found<0;da++)for(let db=-1;db<=1&&found<0;db++){
      const l=near.get((a+da)+','+(b+db));if(!l)continue;
      for(const i of l){const p=store.prints[i];if(hav(s,p)<=NEAR){found=i;break}}
    }
    if(found>=0){hit++;votes[store.prints[found][3]]++}
  }
  return {pct:hit/geo.samples.length*100,animal:votes.indexOf(Math.max(...votes))};
}
let curTown=null,lastLookup=0,lastCov=0,looking=false;
function showTown(){
  const t=curTown&&store.towns[curTown];
  if(!t){$('town').classList.remove('show');return}
  $('town').classList.add('show');$('tname').textContent=t.name+(t.flag!=null?'（制覇）':'');
  $('tpct').textContent='道の'+Math.floor(t.pct)+'%';$('tbar').style.width=Math.min(100,t.pct)+'%';
}
function toast(html){const el=$('toast');el.innerHTML=html;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000)}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateCoverage(force){
  if(!curTown)return;const now=Date.now();if(!force&&now-lastCov<8000)return;lastCov=now;
  const geo=loadGeo(curTown),t=store.towns[curTown];if(!geo||!t)return;
  const r=coverage(geo);t.pct=Math.max(t.pct,r.pct);
  if(t.flag==null&&r.pct>=90){t.flag=r.animal;prints.draw();
    toast(`${esc(t.name)} を制覇！<small>${esc(ANIMALS[r.animal].name)}の旗が立ちました</small>`)}
  save();showTown();stats();
}
async function townTick(p){
  if(curTown){const g=loadGeo(curTown);if(g&&inRings(g.rings,p[0],p[1])){updateCoverage();return}}
  for(const id in store.towns){const g=loadGeo(id);if(g&&inRings(g.rings,p[0],p[1])){curTown=id;updateCoverage(true);return}}
  const now=Date.now();if(looking||now-lastLookup<30000)return;lastLookup=now;looking=true;
  try{const id=await fetchTown(p[0],p[1]);curTown=id;if(id)updateCoverage(true);else showTown()}
  catch(e){}finally{looking=false}
}

const me=L.marker(start,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]}),interactive:false});
const acc=L.circle(start,{radius:10,color:'#2d7ff9',weight:1,fillOpacity:.08,interactive:false});

/* ---------- 足跡を置く ---------- */
const R=6371000,rad=d=>d*Math.PI/180;
const hav=(a,b)=>{const dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const bearing=(a,b)=>{const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360};
let last=null,lastT=0,carry=0,side=1;

let rec=false,here=null,firstFix=true;
function showHere(lat,lng,accuracy){
  const p=[lat,lng];here=p;
  me.setLatLng(p).addTo(map);acc.setLatLng(p).setRadius(accuracy||5).addTo(map);
  if(firstFix){firstFix=false;map.setView(p,17,{animate:false})}
  else if(follow)map.panTo(p,{animate:false});
}
function addPoint(lat,lng,accuracy,t){
  showHere(lat,lng,accuracy);
  if(accuracy<=50)townTick([lat,lng]);
  if(!rec)return;
  const p=[lat,lng];
  if(accuracy>35){msg(`GPSの精度待ち…（±${Math.round(accuracy)}m）`);return}
  if(!last){last=p;lastT=t;msg('記録中：歩くと足跡がつくよ');return}
  const d=hav(last,p),dt=(t-lastT)/1000;
  if(d<1.5)return;
  if(dt>0&&d/dt>12){last=p;lastT=t;return}            // 乗り物・GPS飛び
  const a=ANIMALS[store.animal],h=bearing(last,p);
  let s=a.stride-carry;
  while(s<=d){
    const f=s/d;
    const la=+(last[0]+(p[0]-last[0])*f).toFixed(6),ln=+(last[1]+(p[1]-last[1])*f).toFixed(6),k=cellKey(la,ln);
    if(!used.has(k)){used.add(k);store.prints.push([la,ln,Math.round(h),store.animal,side]);addNear(store.prints.at(-1),store.prints.length-1)}
    side=-side;s+=a.stride;
  }
  carry=a.stride-(s-d);
  store.dist+=d;last=p;lastT=t;
  stats();prints.draw();save();
}

/* ---------- GPS / デモ ---------- */
let watch=null,demoT=null,follow=true,lock=null;
async function wake(){try{if('wakeLock' in navigator)lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&rec)wake()});

// 開いた時点から現在地を表示（記録はしない）
function locate(){
  if(watch!==null)return true;
  if(!('geolocation' in navigator)){msg('この端末は位置情報が使えません。「デモ」で試せます');return false}
  if(!isSecureContext){msg('位置情報は https のページでしか使えません');return false}
  watch=navigator.geolocation.watchPosition(
    g=>{if(!demoT)addPoint(g.coords.latitude,g.coords.longitude,g.coords.accuracy,g.timestamp)},
    e=>{if(e.code===1){msg('位置情報が許可されていません。設定から許可してね');navigator.geolocation.clearWatch(watch);watch=null;if(rec&&!demoT)end()}
        else if(rec)msg('位置が取れません…（屋内かも）')},
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  return true;
}
function begin(){
  if(!locate())return;
  last=null;carry=0;rec=true;
  wake();setGo(true);msg(here?'記録中：歩くと足跡がつくよ':'現在地をさがしています…');
}
function end(){
  rec=false;
  clearInterval(demoT);demoT=null;$('demo').classList.remove('on');
  try{lock&&lock.release()}catch(e){}lock=null;
  setGo(false);msg('一時停止中。足跡は保存されています');
}
function demo(){
  if(demoT){clearInterval(demoT);demoT=null;$('demo').classList.remove('on');last=null;msg('デモを止めました');return}
  last=null;carry=0;rec=true;
  let c=map.getCenter(),p=[c.lat,c.lng],h=Math.random()*360,t=Date.now();
  $('demo').classList.add('on');setGo(true);
  demoT=setInterval(()=>{
    h+=(Math.random()-.5)*50;t+=1000;
    const d=6/R*180/Math.PI;
    p=[p[0]+d*Math.cos(rad(h)),p[1]+d*Math.sin(rad(h))/Math.cos(rad(p[0]))];
    addPoint(p[0],p[1],5,t);
  },350);
  msg('デモ：ランダムに歩いています');
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t;
const stats=()=>{$('dist').textContent=(store.dist/1000).toFixed(2);$('count').textContent=store.prints.length.toLocaleString();$('flags').textContent=Object.values(store.towns).filter(t=>t.flag!=null).length};
const setGo=on=>{const b=$('go');b.classList.toggle('rec',on);b.textContent=on?'記録中（タップで停止）':'記録を再開する'};

function thumb(cv,a){const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);drawPrint(ctx,a,cv.width/2,cv.height/2,cv.width*.78,0)}
function pick(i){
  store.animal=i;save();
  document.documentElement.style.setProperty('--acc',ANIMALS[i].color);
  document.querySelectorAll('.an').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  thumb($('logo'),ANIMALS[i]);
}
$('animals').innerHTML=ANIMALS.map((a,i)=>`<button class="an" data-i="${i}" aria-pressed="false"><canvas width="76" height="76"></canvas>${a.name}</button>`).join('');
document.querySelectorAll('.an').forEach((b,i)=>{thumb(b.querySelector('canvas'),ANIMALS[i]);b.onclick=()=>pick(i)});
pick(Math.min(store.animal||0,ANIMALS.length-1));

$('go').onclick=()=>rec?end():begin();
$('demo').onclick=demo;
$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('on',follow);if(follow&&here)map.setView(here,Math.max(map.getZoom(),17))};
map.on('dragstart',()=>{follow=false;$('follow').classList.remove('on')});
$('fit').onclick=()=>{if(!store.prints.length){msg('まだ足跡がありません');return}
  map.fitBounds(L.latLngBounds(store.prints.map(p=>[p[0],p[1]])),{padding:[40,40],maxZoom:18});follow=false;$('follow').classList.remove('on')};
$('clear').onclick=()=>$('modal').classList.add('show');
$('no').onclick=()=>$('modal').classList.remove('show');
$('yes').onclick=()=>{store.prints=[];used.clear();near.clear();for(const id in store.towns){store.towns[id].pct=0;store.towns[id].flag=null}showTown();store.dist=0;last=null;carry=0;save();stats();prints.draw();$('modal').classList.remove('show');msg('足跡を消しました')};

stats();
if(location.hash==='#debug')window.__dbg={store,townTick,loadGeo,coverage,updateCoverage,get cur(){return curTown},
  fill(id,frac=1){const g=loadGeo(id);for(const p of g.samples.slice(0,Math.floor(g.samples.length*frac))){store.prints.push([p[0],p[1],0,store.animal,1]);addNear(store.prints.at(-1),store.prints.length-1)}prints.draw()},
  go(lat,lng){map.setView([lat,lng],16)}};
begin();
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
